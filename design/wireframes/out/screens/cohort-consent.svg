135.0" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="start" font-weight="normal">TEXT: Exactly what is sent: sessions started, skills reached, days since first open</text><rect x="16" y="195.0" width="361" height="72.0" rx="4" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.2"/><text x="26" y="215.0" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="start" font-weight="normal">TEXT: Exactly what is never sent: name, age, voice, drawings, device id, anything identifying</text><text x="20" y="289.0" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="start" font-weight="normal">Label 1</text><rect x="16" y="295.0" width="361" height="38.0" rx="4" fill="white" stroke="#6B7280" stroke-width="1.2"/><text x="20" y="341.0" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="9" fill="#6B7280" text-anchor="start" font-weight="normal">Study code from the teacher or the study team</text><rect x="16" y="351.0" width="361" height="120.0" rx="8" fill="white" stroke="#6B7280" stroke-width="1.2"/><text x="30" y="377.0" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="600">Leave the study: one tap, deletes the token, stops all uploads</text><rect x="30" y="391.0" width="216.6" height="10" rx="4" fill="#F3F4F6" stroke="#F3F4F6" stroke-width="1.2"/><rect x="30" y="407.0" width="144.4" height="10" rx="4" fill="#F3F4F6" stroke="#F3F4F6" stroke-width="1.2"/></svg>