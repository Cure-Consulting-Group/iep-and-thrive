name: Release

# TASK-LP-055. Replaces a workflow that built the web app and deployed Hosting
# only — no rules, no Functions, no indexes, and no test gate of any kind. A
# green build was not a release of the application's authorization or behavior,
# and a failing security test could not stop a deploy because nothing consulted
# it.
#
# The graph is: verify -> build -> deploy, with deploy ordered
# indexes -> rules -> functions -> hosting, all from one commit.
#
# Why that order. Indexes must exist before a query that needs them, or the
# first request after deploy fails. Rules go before Functions and Hosting
# because they are the security boundary: tightening them early is safe, while
# shipping a client that assumes new rules against old permissive ones is the
# window an attacker wants. Hosting is last because it is the easiest to roll
# back and the least dangerous to lag.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Run verification only, do not deploy'
        type: boolean
        default: false

# One release at a time. Two concurrent deploys can interleave rules and
# Functions from different commits, which is exactly the mismatch this
# workflow exists to prevent. Do not cancel in progress — a half-finished
# deploy is worse than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Matches the `engines.node` declared in functions/package.json. CI previously
  # ran Node 20 against Functions declaring 22, so CI was not exercising the
  # runtime that actually executes in production.
  NODE_VERSION: '22'
  PROJECT_ID: iep-and-thrive

jobs:
  verify:
    name: Verify (unit, types, functions, rules)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@cure-consulting-group'

      # GITHUB_TOKEN cannot read the private @cure-consulting-group/* scope from
      # this repo; a classic PAT with read:packages is required.
      - name: Install web dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_READ_TOKEN }}

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Project lock check
        run: node scripts/verify-firebase.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Web unit tests
        run: npm run test:unit

      - name: Functions build
        run: npm --prefix functions run build

      - name: Functions tests
        run: npm --prefix functions test

      # The gate that did not exist. A rules regression now stops the release
      # rather than being discovered after deploy.
      - name: Security rules tests
        run: |
          npx --no-install firebase emulators:exec \
            --config firebase.security.json \
            --project demo-iep-security \
            "npm run test:security"

  build:
    name: Build web
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@cure-consulting-group'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_READ_TOKEN }}

      - name: Build Next.js static export
        run: npm run build
        env:
          # Public Firebase config — safe to commit, and asserted for coherence
          # at startup by lib/env.ts. NEXT_PUBLIC_FIREBASE_ENV is explicit so a
          # production build cannot be reclassified by a hostname.
          NEXT_PUBLIC_FIREBASE_ENV: production
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyBI4iQ3G265Yawhbg_lUXQTggJBpYPueww
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: iep-and-thrive.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: iep-and-thrive
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: iep-and-thrive.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '564060847585'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:564060847585:web:1b8a235db532454f9166a0'
          NEXT_PUBLIC_SITE_URL: https://iepandthrive.com

      # TASK-LP-035 relies on the export emitting 404.html so Hosting can serve
      # a real not-found instead of the marketing homepage. Assert it rather
      # than assuming it.
      - name: Assert 404 page was exported
        run: |
          test -f out/404.html || {
            echo "::error::out/404.html missing — Hosting will fall back to the"
            echo "::error::homepage for unknown URLs (TASK-LP-035 regression)."
            exit 1
          }
          echo "out/404.html present ($(wc -c < out/404.html) bytes)"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-export-${{ github.sha }}
          path: out/
          retention-days: 14

  deploy:
    name: Deploy all surfaces
    needs: [verify, build]
    # Deliberately workflow_dispatch ONLY — a push to main verifies and builds
    # but does not deploy.
    #
    # The previous workflow auto-deployed Hosting on every merge. This one also
    # deploys rules, Functions and indexes, and the first release carrying the
    # A01 changes must not go out until admin custom claims have been
    # provisioned: isAdmin() resolves request.auth.token.admin, so deploying
    # the tightened rules first locks every administrator out of the admin UI.
    # See docs/runbooks/release-trust-repairs.md, which orders that explicitly.
    #
    # Once TASK-LP-006 has been executed and the owner wants merges to release
    # again, add `github.event_name == 'push' ||` back to this condition.
    if: github.event_name == 'workflow_dispatch' && inputs.skip_deploy != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Attach branch/deployment protection rules to this environment in repo
    # settings to require a human approval before production deploys.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@cure-consulting-group'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_READ_TOKEN }}

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      # Promote the exact artifact that was verified, rather than rebuilding
      # and hoping the second build matches the first.
      - name: Download verified web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-export-${{ github.sha }}
          path: out/

      # google-github-actions/auth writes the credential itself and exports
      # GOOGLE_APPLICATION_CREDENTIALS, which keeps the key out of a shell line
      # where it could be echoed, and provides gcloud for the rules read-back.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Record the revision being released
        run: |
          echo "Releasing ${{ github.sha }} to $PROJECT_ID" | tee release-evidence.txt
          {
            echo "commit:        ${{ github.sha }}"
            echo "firestore.rules sha256: $(sha256sum firestore.rules | cut -d' ' -f1)"
            echo "storage.rules   sha256: $(sha256sum storage.rules | cut -d' ' -f1)"
            echo "indexes         sha256: $(sha256sum firestore.indexes.json | cut -d' ' -f1)"
          } | tee -a release-evidence.txt

      # Ordered deliberately. See the header comment.
      - name: 1/4 Deploy Firestore indexes
        run: npx --no-install firebase deploy --only firestore:indexes --project "$PROJECT_ID" --non-interactive

      - name: 2/4 Deploy rules
        run: npx --no-install firebase deploy --only firestore:rules,storage --project "$PROJECT_ID" --non-interactive

      - name: 3/4 Deploy Functions
        run: npx --no-install firebase deploy --only functions --project "$PROJECT_ID" --non-interactive

      - name: 4/4 Deploy Hosting
        run: npx --no-install firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive

      # Confirms the second acceptance criterion: what is running matches the
      # revision that was reviewed and verified.
      #
      # firebase-tools has no `firestore:rules:get` — an earlier version of this
      # step used it, which would have errored on every release, been swallowed
      # by `|| true`, and then failed the diff AFTER all four surfaces had
      # already deployed. The Firebase Rules REST API is the supported way to
      # read back what is actually live.
      - name: Verify deployed rules match this commit
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          fail=0
          for pair in "cloud.firestore:firestore.rules" "cloud.storage:storage.rules"; do
            release="${pair%%:*}"; local_file="${pair##*:}"
            ruleset=$(curl -sS -H "Authorization: Bearer $TOKEN" \
              "https://firebaserules.googleapis.com/v1/projects/$PROJECT_ID/releases/$release" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("rulesetName",""))')
            if [ -z "$ruleset" ]; then
              echo "::error::Could not read the deployed ruleset for $release."
              fail=1; continue
            fi
            curl -sS -H "Authorization: Bearer $TOKEN" \
              "https://firebaserules.googleapis.com/v1/$ruleset" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["source"]["files"][0]["content"], end="")' \
              > "/tmp/deployed.$local_file"
            if diff -q "$local_file" "/tmp/deployed.$local_file" >/dev/null 2>&1; then
              echo "$local_file matches the deployed ruleset ($ruleset)" | tee -a release-evidence.txt
            else
              echo "::error::Deployed $local_file differs from ${{ github.sha }}."
              diff "$local_file" "/tmp/deployed.$local_file" || true
              fail=1
            fi
          done
          exit $fail

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence.txt
          retention-days: 90

