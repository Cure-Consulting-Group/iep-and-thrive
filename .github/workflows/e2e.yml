name: E2E (Playwright)

# Both jobs run against the DEPLOYED site, not the PR's code. That is a known
# structural problem tracked in TASK-LP-055 (gate releases on verification and
# deploy every Firebase surface): a pull request cannot change what these tests
# observe, so a red result here is a statement about production, not about the
# diff. Until that ticket lands, the split below keeps the merge gate honest.
#
#   pr-gate       — specs that are deterministic and read-only against
#                   production. These must pass to merge.
#   full-suite    — everything, including specs that write to production data
#                   or require the admin custom claim. Non-gating, on a
#                   schedule and on demand, so the signal stays visible.
#
# The three admin-curriculum specs, photo-release, and enrollment-agreement are
# in the second group because they fail for an operational reason no PR can
# fix: writes to adminTasks / probes / assessmentResults require
# request.auth.token.admin, and the seeded production admin account does not
# carry that claim. See the September 6 2026 correction on TASK-LP-006. Do not
# move them back into the gate by loosening their assertions — they are
# reporting a real gap.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 07:00 America/New_York, daily.
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  E2E_BASE_URL: https://iep-and-thrive.web.app
  # Explicit acknowledgement that this targets production. tests/e2e/target.ts
  # refuses to run without it (TASK-LP-069), and mutating specs refuse even
  # with it — they belong on staging, which is why the full suite is
  # non-gating until TASK-LP-054's staging project exists.
  E2E_ALLOW_PRODUCTION: '1'

jobs:
  pr-gate:
    name: Playwright smoke tests (production, gating)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      E2E_INQUIRY_PASSWORD: ${{ secrets.E2E_INQUIRY_PASSWORD }}
      E2E_DEPOSITED_PASSWORD: ${{ secrets.E2E_DEPOSITED_PASSWORD }}
      E2E_ENROLLED_PASSWORD: ${{ secrets.E2E_ENROLLED_PASSWORD }}
      E2E_SUBSCRIBER_PASSWORD: ${{ secrets.E2E_SUBSCRIBER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      # `registry-url` + `scope` makes setup-node write a scoped .npmrc
      # that routes @cure-consulting-group/* through GitHub Packages while
      # leaving the default npm registry intact for every other dep.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@cure-consulting-group'

      # GITHUB_TOKEN can't read the private @cure-consulting-group/* scope
      # because the package's source repo doesn't grant this repo access
      # via Manage Actions access. Use a classic PAT with `read:packages`.
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_READ_TOKEN }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - run: npx playwright install --with-deps chromium

      - name: Run gating Playwright specs
        run: |
          npx playwright test \
            tests/e2e/marketing.spec.ts \
            tests/e2e/tutoring.spec.ts \
            tests/e2e/auth-personas.spec.ts \
            tests/e2e/portal-state.spec.ts \
            tests/e2e/email-lifecycle.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-gate
          path: playwright-report/
          retention-days: 7

      - name: Upload trace artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-gate
          path: test-results/
          retention-days: 7

  full-suite:
    name: Playwright full suite (production, non-gating)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      E2E_INQUIRY_PASSWORD: ${{ secrets.E2E_INQUIRY_PASSWORD }}
      E2E_DEPOSITED_PASSWORD: ${{ secrets.E2E_DEPOSITED_PASSWORD }}
      E2E_ENROLLED_PASSWORD: ${{ secrets.E2E_ENROLLED_PASSWORD }}
      E2E_SUBSCRIBER_PASSWORD: ${{ secrets.E2E_SUBSCRIBER_PASSWORD }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@cure-consulting-group'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_READ_TOKEN }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - run: npx playwright install --with-deps chromium

      # The three mutating specs (admin-curriculum, photo-release,
      # enrollment-agreement) are excluded here, not skipped by accident. They
      # write real records, and tests/e2e/target.ts now refuses to run them
      # against production at all (TASK-LP-069). They move into this job the
      # moment TASK-LP-054's staging project exists; until then they run
      # nowhere, which is the honest state and is tracked on those tickets.
      - name: Run full Playwright suite (read-only specs)
        run: |
          npx playwright test \
            --ignore-snapshots \
            tests/e2e/marketing.spec.ts \
            tests/e2e/tutoring.spec.ts \
            tests/e2e/auth-personas.spec.ts \
            tests/e2e/portal-state.spec.ts \
            tests/e2e/email-lifecycle.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 7

      - name: Upload trace artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-full
          path: test-results/
          retention-days: 7
